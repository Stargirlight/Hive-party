<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - The Hive Party</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .track-wrapper {
            background-color: #000;
            min-height: 100vh;
            padding-top: 140px;
            padding-bottom: 60px;
        }

        .track-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .track-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 50px 40px;
            border: 1px solid rgba(218, 63, 8, 0.2);
        }

        .order-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .order-header h1 {
            font-family: 'Anton', sans-serif;
            font-size: 3rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .order-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #da3f08;
            margin-bottom: 25px;
            font-family: 'Poppins', sans-serif;
        }

        .status-badge {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-pending_payment {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 2px solid rgba(255, 193, 7, 0.3);
        }

        .status-pending_confirmation {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 2px solid rgba(255, 193, 7, 0.3);
        }

        .status-approved {
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
            border: 2px solid rgba(76, 175, 80, 0.3);
        }

        .status-declined {
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
            border: 2px solid rgba(244, 67, 54, 0.3);
        }

        .status-expired {
            background: rgba(158, 158, 158, 0.15);
            color: #9e9e9e;
            border: 2px solid rgba(158, 158, 158, 0.3);
        }

        .order-details {
            background: rgba(218, 63, 8, 0.05);
            padding: 35px;
            border-radius: 12px;
            margin: 40px 0;
            border: 1px solid rgba(218, 63, 8, 0.2);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid rgba(218, 63, 8, 0.15);
            font-family: 'Poppins', sans-serif;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #999;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .detail-value {
            font-weight: 700;
            color: #fff;
            font-size: 15px;
        }

        .timeline {
            margin: 50px 0;
        }

        .timeline-item {
            display: flex;
            gap: 25px;
            margin-bottom: 35px;
            position: relative;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 14px;
            top: 35px;
            bottom: -35px;
            width: 2px;
            background: rgba(218, 63, 8, 0.2);
        }

        .timeline-item:last-child::before {
            display: none;
        }

        .timeline-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(218, 63, 8, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 1;
            color: #666;
        }

        .timeline-item.active .timeline-icon {
            background: #da3f08;
            border-color: #da3f08;
            color: #fff;
            box-shadow: 0 0 20px rgba(218, 63, 8, 0.5);
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-title {
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
        }

        .timeline-time {
            font-size: 14px;
            color: #999;
            font-family: 'Poppins', sans-serif;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border: 2px solid #da3f08;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #da3f08;
            color: #fff;
        }

        .btn-primary:hover {
            background: #ff5722;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #da3f08;
        }

        .btn-secondary:hover {
            background: #da3f08;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 80px;
            color: #999;
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
        }

        .error-message {
            text-align: center;
            padding: 80px 40px;
        }

        .error-message h2 {
            font-family: 'Anton', sans-serif;
            color: #f44336;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-transform: uppercase;
        }

        .error-message p {
            color: #999;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .track-card {
                padding: 30px 25px;
            }

            .order-header h1 {
                font-size: 2.2rem;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div id="preloader">
        <img src="./assets/images/logo (1).png" alt="Logo" class="preloader-logo">
    </div>

    <!-- Header Navigation -->
    <section class="header">
        <div class="LayoutIndex-header-nav-wrap">
            <div class="navbar section-wrapper">
                <div class="HeaderNavComponent">
                    <div class="HeaderNavComponent-size-wrap">
                        <div class="HeaderNavComponent-logo">
                            <figure class="HeaderNavComponent-imgbox">
                                <a href="./index.html">
                                    <img src="./assets/images/logo (1).png" alt="logo image" class="logo"/>
                                </a>
                            </figure>
                        </div>
                        <div class="hamburger" id="hamburger">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="HeaderNavComponent-nav-link-listbox" id="nav-links">
                            <div class="HeaderNavComponent-item-row">
                                <a href="./index.html" class="HeaderNavComponent-name">home</a>
                            </div>
                            <div class="HeaderNavComponent-item-row">
                                <a href="./index.html#about" class="HeaderNavComponent-name">About us</a>
                            </div>
                            <div class="HeaderNavComponent-item-row">
                                <a href="./index.html#sponsors" class="HeaderNavComponent-name">Sponsors</a>
                            </div>
                            <div class="HeaderNavComponent-item-row">
                                <a href="./ticket.html" class="HeaderNavComponent-name">Tickets</a>
                            </div>
                            <div class="HeaderNavComponent-item-row">
                                <a href="./index.html#faqs" class="HeaderNavComponent-name">faqs</a>
                            </div>
                            <div class="HeaderNavComponent-item-row">
                                <a href="./contact.html" class="HeaderNavComponent-name">contact us</a>
                            </div>
                            <div class="HeaderNavComponent-item-row">
                                <a href="./location.html" class="HeaderNavComponent-name">getting here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="track-wrapper">
        <div class="track-container">
            <div class="track-card">
                <div id="loadingState" class="loading">
                    <p>Loading order details...</p>
                </div>

                <div id="errorState" class="error-message" style="display: none;">
                    <h2>Order Not Found</h2>
                    <p>We couldn't find an order with that number.</p>
                    <button class="btn btn-primary" onclick="window.location.href='index.html'">
                        Back to Home
                    </button>
                </div>

                <div id="orderContent" style="display: none;">
                    <div class="order-header">
                        <h1>Order Status</h1>
                        <div class="order-number" id="orderNumber">-</div>
                        <span class="status-badge" id="statusBadge">-</span>
                    </div>

                    <div class="order-details">
                        <div class="detail-row">
                            <span class="detail-label">Customer Name:</span>
                            <span class="detail-value" id="customerName">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Email:</span>
                            <span class="detail-value" id="customerEmail">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Ticket Type:</span>
                            <span class="detail-value" id="ticketType">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Quantity:</span>
                            <span class="detail-value" id="quantity">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Total Amount:</span>
                            <span class="detail-value" id="totalAmount">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Order Date:</span>
                            <span class="detail-value" id="orderDate">-</span>
                        </div>
                    </div>

                    <div class="timeline" id="timeline">
                        <!-- Timeline will be populated by JS -->
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                            Back to Home
                        </button>
                        <button class="btn btn-primary" onclick="location.reload()">
                            Refresh Status
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:3000/api';

        async function loadOrder() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderNumber = urlParams.get('order');

            if (!orderNumber) {
                showError();
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/orders/${orderNumber}`);

                if (!response.ok) {
                    showError();
                    return;
                }

                const order = await response.json();
                displayOrder(order);
            } catch (error) {
                console.error('Error loading order:', error);
                showError();
            }
        }

        function displayOrder(order) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('orderContent').style.display = 'block';

            document.getElementById('orderNumber').textContent = order.orderNumber;
            document.getElementById('customerName').textContent = order.userName;
            document.getElementById('customerEmail').textContent = order.userEmail;
            document.getElementById('ticketType').textContent = order.ticketType.charAt(0).toUpperCase() + order.ticketType.slice(1);
            document.getElementById('quantity').textContent = `${order.quantity} ticket(s)`;
            document.getElementById('totalAmount').textContent = `KES ${order.totalAmount.toLocaleString()}`;
            document.getElementById('orderDate').textContent = new Date(order.createdAt).toLocaleString();

            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = formatStatus(order.status);
            statusBadge.className = `status-badge status-${order.status}`;

            renderTimeline(order);
        }

        function renderTimeline(order) {
            const timeline = document.getElementById('timeline');
            const events = [];

            events.push({
                title: 'Order Created',
                time: new Date(order.createdAt).toLocaleString(),
                active: true
            });

            if (order.status === 'pending_payment') {
                events.push({
                    title: 'Waiting for Payment',
                    time: 'Please complete payment and upload proof',
                    active: true
                });
            }

            if (order.paymentProofUrl || order.status !== 'pending_payment') {
                events.push({
                    title: 'Payment Proof Submitted',
                    time: 'Under review',
                    active: order.status === 'pending_confirmation'
                });
            }

            if (order.status === 'approved') {
                events.push({
                    title: 'Payment Approved',
                    time: order.confirmedAt ? new Date(order.confirmedAt).toLocaleString() : 'Approved',
                    active: true
                });

                events.push({
                    title: 'Tickets Sent',
                    time: 'Check your email for tickets',
                    active: true
                });
            }

            if (order.status === 'declined') {
                events.push({
                    title: 'Payment Declined',
                    time: order.adminNotes || 'Payment could not be verified',
                    active: true
                });
            }

            if (order.status === 'expired') {
                events.push({
                    title: 'Order Expired',
                    time: 'Payment time limit exceeded',
                    active: true
                });
            }

            timeline.innerHTML = events.map(event => `
                <div class="timeline-item ${event.active ? 'active' : ''}">
                    <div class="timeline-icon">
                        ${event.active ? '●' : '○'}
                    </div>
                    <div class="timeline-content">
                        <div class="timeline-title">${event.title}</div>
                        <div class="timeline-time">${event.time}</div>
                    </div>
                </div>
            `).join('');
        }

        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        }

        function formatStatus(status) {
            return status.replace(/_/g, ' ').toUpperCase();
        }

        // Load order on page load
        loadOrder();
    </script>
</body>
</html>
